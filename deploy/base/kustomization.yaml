  - ../../config/crd/gpufabric.dev_gpunodepools.yaml
  - ../../config/crd/gpufabric.dev_nodeclaims.yaml
  - ../rbac/role.yaml
  - rbac.yaml
  - deployment.yaml
  - webhook.yaml
  - monitoring.yaml
configMapGenerator:
  - name: gpu-fabric-provisioner
    files:
      - controller.yaml=../../config/controller.yaml
