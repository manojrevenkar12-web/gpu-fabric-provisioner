version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose
    - copyloopvar
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
      - path: internal/sim/
        linters: [errcheck]
formatters:
  enable: [gofmt, goimports]
