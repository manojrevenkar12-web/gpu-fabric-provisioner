---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: gpunodepools.gpufabric.dev
spec:
  group: gpufabric.dev
  names:
    kind: GPUNodePool
    listKind: GPUNodePoolList
    plural: gpunodepools
    shortNames:
    - gnp
    singular: gpunodepool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.instanceType
      name: Type
      type: string
    - jsonPath: .status.nodes
      name: Nodes
      type: integer
    - jsonPath: .status.initialized
      name: Initialized
      type: integer
    - jsonPath: .status.inFlight
      name: InFlight
      type: integer
    - jsonPath: .status.drifted
      name: Drifted
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GPUNodePool is a set of GPU servers of one instance type the
          provisioner manages.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GPUNodePoolSpec says which GPU servers the provisioner may create for a cluster and how it may
              disrupt them.
            properties:
              disruption:
                default: {}
                description: 'Disruption controls voluntary disruption: consolidation
                  and drift.'
                properties:
                  consolidateAfter:
                    default: 5m
                    description: ConsolidateAfter is how long a node must be empty,
                      or replaceable, before it is removed.
                    type: string
                  consolidation:
                    default: true
                    description: Consolidation can be switched off for a pool (drift
                      and repair still happen).
                    type: boolean
                  gangPolicy:
                    default: WaitForCompletion
                    description: GangPolicy decides when nodes running gang members
                      may be replaced.
                    enum:
                    - WaitForCompletion
                    - Never
                    type: string
                  maxSurge:
                    default: 1
                    description: MaxSurge is how many replacement nodes a rolling
                      upgrade may create ahead of removing old ones.
                    format: int32
                    minimum: 0
                    type: integer
                  maxUnavailable:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 10%
                    description: MaxUnavailable bounds how many nodes of the pool
                      may be disrupted at once (count or percent).
                    x-kubernetes-int-or-string: true
                type: object
              fabrics:
                description: Fabrics the pool may place nodes in. Empty means every
                  fabric that offers the instance type.
                items:
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              image:
                description: |-
                  Image is the node image. Changing it marks every existing node of the pool as drifted, and
                  nodes are replaced by a rolling upgrade.
                minLength: 1
                type: string
              instanceType:
                description: InstanceType is the cloud instance type (platform and
                  preset) of every node in the pool.
                minLength: 1
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Labels added to every node of the pool.
                type: object
              limits:
                default: {}
                description: PoolLimits bounds the size of a pool.
                properties:
                  maxNodes:
                    description: MaxNodes counts nodes being created and nodes being
                      replaced.
                    format: int32
                    minimum: 0
                    type: integer
                  minNodes:
                    description: MinNodes is kept running even when nothing needs
                      them.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              taints:
                description: Taints added to every node of the pool. Pods must tolerate
                  them to be provisioned for.
                items:
                  description: |-
                    The node this Taint is attached to has the "effect" on
                    any pod that does not tolerate the Taint.
                  properties:
                    effect:
                      description: |-
                        Required. The effect of the taint on pods
                        that do not tolerate the taint.
                        Valid effects are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: Required. The taint key to be applied to a node.
                      type: string
                    timeAdded:
                      description: |-
                        TimeAdded represents the time at which the taint was added.
                        It is only written for NoExecute taints.
                      format: date-time
                      type: string
                    value:
                      description: The taint value corresponding to the taint key.
                      type: string
                  required:
                  - effect
                  - key
                  type: object
                type: array
              weight:
                description: Weight orders pools that could both serve a pod; the
                  higher weight is tried first.
                format: int32
                maximum: 100
                minimum: 0
                type: integer
            required:
            - disruption
            - image
            - instanceType
            - limits
            type: object
            x-kubernetes-validations:
            - message: limits.minNodes must not exceed limits.maxNodes
              rule: '!has(self.limits.maxNodes) || self.limits.minNodes <= self.limits.maxNodes'
          status:
            description: GPUNodePoolStatus is observed state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              drifted:
                description: Drifted counts nodes whose template differs from the
                  pool's.
                format: int32
                type: integer
              gpus:
                description: GPUs is the GPU capacity of all nodes of the pool, initialized
                  or not.
                format: int64
                type: integer
              inFlight:
                description: InFlight counts nodes that have been requested but are
                  not initialized yet.
                format: int32
                type: integer
              initialized:
                description: Initialized counts nodes that are ready and advertise
                  all their GPUs.
                format: int32
                type: integer
              nodes:
                description: Nodes counts NodeClaims of the pool, in any phase.
                format: int32
                type: integer
              observedGeneration:
                format: int64
                type: integer
              templateHash:
                description: TemplateHash identifies the current node template; NodeClaims
                  with another hash are drifted.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
