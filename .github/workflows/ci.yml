name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ENVTEST_K8S_VERSION: "1.33.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || { echo "::error::go.mod/go.sum not tidy"; exit 1; }
      - name: Generated code and CRDs are current
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.18.0
          make generate
          git diff --exit-code || { echo "::error::run make generate"; exit 1; }
      - name: Vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
      - name: Unit tests
        run: go test -short -race -count=1 ./... 2>&1 | tee unit.log; test ${PIPESTATUS[0]} -eq 0 || { grep -E "^(--- FAIL|FAIL|panic)" unit.log | head -20 | sed 's/^/::error::/'; exit 1; }

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: envtest binaries (kube-apiserver, etcd)
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.21
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use $ENVTEST_K8S_VERSION --bin-dir /tmp/envtest -p path)" >> "$GITHUB_ENV"
      - name: Integration tests against a real API server
        run: go test -race -count=1 -timeout 20m ./... 2>&1 | tee integration.log; test ${PIPESTATUS[0]} -eq 0 || { grep -E "^(--- FAIL|FAIL|panic)|_test.go:[0-9]+:" integration.log | head -30 | sed 's/^/::error::/'; exit 1; }

  image:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gpu-fabric-provisioner:ci .
      - name: Image runs
        run: docker run --rm gpu-fabric-provisioner:ci --help 2>&1 | grep -q cloud-url

  drills:
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.21
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use $ENVTEST_K8S_VERSION --bin-dir /tmp/envtest -p path)" >> "$GITHUB_ENV"
      - name: Fault drills against a real API server, with the naive baseline
        run: go run ./cmd/drill -out /tmp/drills.json -report /tmp/DRILLS.md 2>&1 | grep -E "^==|jobs,|::error"
      - name: Release gate
        run: go run ./cmd/gate -in /tmp/drills.json
      - name: Scale smoke test (1,000 nodes)
        run: go run ./cmd/scale -nodes 1000 -out /tmp/scale.json 2>&1 | grep -v "^ "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drill-results
          path: /tmp/*.json
